<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password | CourseSweep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <img class="logo" src="assets/logo.png" alt="CourseSweep" width="662" height="181">
    <p class="tagline">Build your best semester, one sweep at a time.</p>

    <section class="card" aria-labelledby="forgot-heading">
      <h1 id="forgot-heading">Forgot password</h1>

      <form id="forgot-form" novalidate>
        <p class="card-text">Enter your account email and we will send you a link to choose a new password.</p>
        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="field">
          <label for="email">School email</label>
          <input type="email" id="email" name="email" autocomplete="username"
                 placeholder="you@university.edu" aria-describedby="email-error" required>
          <p id="email-error" class="field-error" hidden></p>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Send reset link</button>
      </form>

      <p id="sent" class="form-success" role="status" hidden>
        If an account exists for that email, a reset link is on its way. The link works once and expires in 30 minutes.
      </p>

      <p class="card-links"><a href="index.html">Back to sign in</a></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/form.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
