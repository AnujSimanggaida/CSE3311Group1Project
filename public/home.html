<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | CourseSweep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="home.html"><img class="topbar-logo" src="assets/logo.png" alt="CourseSweep home" width="662" height="181"></a>
    <div class="topbar-user">
      <a class="btn-ghost" href="profile.html">My degree</a>
      <a id="admin-link" class="btn-ghost" href="admin.html" hidden>Admin</a>
      <span id="user-email"></span>
      <button type="button" id="sign-out" class="btn-ghost">Sign out</button>
    </div>
  </header>

  <main class="page">
    <h1 class="home-heading">What would you like to do?</h1>

    <div class="choices">
      <button type="button" class="choice" data-choice="new">
        <span class="choice-icon" aria-hidden="true">+</span>
        <span class="choice-title">Create a new schedule</span>
        <span class="choice-text">Add courses from the catalog or create your own.</span>
      </button>

      <a class="choice" href="profile.html">
        <span class="choice-icon" aria-hidden="true">&#10003;</span>
        <span class="choice-title">My degree</span>
        <span class="choice-text">Choose your major and mark the courses you have already taken.</span>
      </a>

      <button type="button" class="choice" data-choice="existing">
        <span class="choice-icon" aria-hidden="true">&#9776;</span>
        <span class="choice-title">View existing schedules</span>
        <span class="choice-text">Open, rename or delete a schedule you have saved.</span>
      </button>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/topbar.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
