<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | CourseSweep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <img class="logo" src="assets/logo.png" alt="CourseSweep" width="662" height="181">
    <p class="tagline">Build your best semester, one sweep at a time.</p>

    <section class="card" aria-labelledby="login-heading">
      <h1 id="login-heading">Sign in</h1>

      <form id="login-form" novalidate>
        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="field">
          <label for="email">School email</label>
          <input type="email" id="email" name="email" autocomplete="username"
                 placeholder="you@university.edu" aria-describedby="email-error" required>
          <p id="email-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password"
                   aria-describedby="password-error" required>
            <button type="button" id="toggle-password" class="toggle-password" aria-pressed="false">Show</button>
          </div>
          <p id="password-error" class="field-error" hidden></p>
        </div>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember">
            Keep me signed in
          </label>
          <a href="forgot.html">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Sign in</button>
      </form>

      <div id="google-divider" class="divider" hidden><span>or</span></div>
      <a id="google-btn" class="btn-google" href="/api/google/start" hidden>
        <svg class="google-logo" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </a>

      <p class="card-links">New to CourseSweep? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/form.js"></script>
  <script src="js/login.js"></script>
  <script src="js/google.js"></script>
</body>
</html>
