<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | CourseSweep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <img class="logo" src="assets/logo.png" alt="CourseSweep" width="662" height="181">
    <p class="tagline">Build your best semester, one sweep at a time.</p>

    <section class="card" aria-labelledby="reset-heading">
      <h1 id="reset-heading">Choose a new password</h1>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password"
                   aria-describedby="password-hint password-error" required>
            <button type="button" id="toggle-password" class="toggle-password" aria-pressed="false">Show</button>
          </div>
          <p id="password-hint" class="field-hint">At least 8 characters.</p>
          <p id="password-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password"
                 aria-describedby="confirm-error" required>
          <p id="confirm-error" class="field-error" hidden></p>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Save new password</button>
      </form>

      <p id="done" class="form-success" role="status" hidden>
        Your password has been changed. You can now sign in with the new one.
      </p>

      <p class="card-links"><a href="index.html">Back to sign in</a> · <a href="forgot.html">Request a new link</a></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/form.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
